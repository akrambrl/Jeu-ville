# Publie le jeu web (et la page légale) gratuitement sur GitHub Pages :
# à chaque envoi, le jeu est compilé puis copié sur la branche « gh-pages »,
# servie à l'adresse https://<compte>.github.io/<dépôt>/.
# Jeu en ligne : ajouter dans Settings → Secrets and variables → Actions →
# Variables : VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY (voir docs/STORES.md).
name: Jeu web (GitHub Pages)

on:
  push:
    branches: [main, claude/hide-and-seek-multiplayer-3d8icz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @jeu-ville/client build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Copier le jeu compilé sur la branche gh-pages
        run: |
          cd apps/client/dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Jeu web compilé depuis ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
